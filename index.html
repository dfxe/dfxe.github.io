<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>BLOC</title>
        <style>
            @import url("https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Unbounded:wght@300;400;500;600;700;800;900&display=swap");

            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            :root {
                --ink: #000;
                --paper: #f2efe9;
                --accent: #ff3b00;
                --faded: #8a8780;
            }

            html {
                font-size: 16px;
            }

            body {
                font-family: "Bricolage Grotesque", "Helvetica Neue", Helvetica,
                    Arial, sans-serif;
                background: var(--paper);
                color: var(--ink);
                line-height: 1;
                -webkit-font-smoothing: antialiased;
                text-rendering: optimizeLegibility;
                overflow-x: hidden;
            }

            a {
                color: inherit;
                text-decoration: underline wavy;
                text-decoration-thickness: 3px;
                text-underline-offset: 6px;
            }

            /* --- Marquee header --- */

            .marquee {
                overflow: hidden;
                white-space: nowrap;
                padding: 0.5rem 0;
                font-family: "Unbounded", sans-serif;
                font-weight: 400;
                font-size: 0.95rem;
                letter-spacing: 0.02em;
                text-transform: uppercase;
            }

            .marquee-track {
                display: inline-block;
                animation: marquee 40s linear infinite;
                padding-left: 100%;
            }

            .marquee-track span {
                margin-right: 3rem;
            }

            .marquee-track span::before {
                content: "◆ ";
                color: var(--accent);
            }

            @keyframes marquee {
                from {
                    transform: translateX(0);
                }
                to {
                    transform: translateX(-100%);
                }
            }

            /* --- Drops --- */

            .drops {
                list-style: none;
            }

            .drop {
                position: relative;
            }

            .drop a.drop-link {
                display: block;
                color: inherit;
                text-decoration: none;
                padding: 1.5rem 1.5rem 2rem;
            }

            .drop a.drop-link:hover {
                background: var(--ink);
                color: var(--paper);
            }

            .drop-heading {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 1rem;
            }

            .drop-title {
                font-family: "Unbounded", sans-serif;
                font-weight: 400;
                font-size: clamp(2rem, 7vw, 5rem);
                line-height: 1.15;
                letter-spacing: -0.03em;
                text-transform: uppercase;
                flex: 1;
                min-width: 0;
                text-align: right;
                white-space: nowrap;
                clip-path: inset(0 0 -0.4em 0);
            }

            .drop-title-inner {
                display: inline-block;
            }

            .drop-title.is-ticker .drop-title-inner {
                padding-left: 100%;
                animation: drop-title-ticker 14s linear infinite;
                will-change: transform;
            }

            @keyframes drop-title-ticker {
                from {
                    transform: translateX(0);
                }
                to {
                    transform: translateX(-100%);
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .drop-title.is-ticker .drop-title-inner {
                    animation: none;
                    padding-left: 0;
                }
            }

            .drop-title .drop-num {
                color: var(--accent);
                margin-left: 0.4em;
            }

            .drop a.drop-link:hover .drop-title .drop-num {
                color: var(--paper);
            }

            .drop-arrow {
                font-family: "Unbounded", sans-serif;
                font-weight: 400;
                font-size: clamp(1.6rem, 5vw, 3rem);
                line-height: 1;
                flex-shrink: 0;
            }

            /* --- Footer strip --- */

            .footer-strip {
                padding: 2rem 1.5rem;
                font-family: "Unbounded", sans-serif;
                font-weight: 400;
                font-size: 0.8rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                display: flex;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 1rem;
            }

            .footer-strip a:hover {
                color: var(--accent);
            }

            @media (max-width: 600px) {
                .drop a.drop-link,
                .footer-strip {
                    padding-left: 1rem;
                    padding-right: 1rem;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .marquee-track {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="marquee" aria-hidden="true">
            <div class="marquee-track">
                <span>BLOC</span><span>DROP 002 LOADING</span
                ><span>BLOC</span><span>DROP 002 LOADING</span
                ><span>BLOC</span><span>DROP 002 LOADING</span
                ><span>BLOC</span><span>DROP 002 LOADING</span
                ><span>BLOC</span><span>DROP 002 LOADING</span
                ><span>BLOC</span><span>DROP 002 LOADING</span>
            </div>
        </div>

        <main>
            <ul class="drops">
                <li class="drop">
                    <a class="drop-link" href="#">
                        <div class="drop-heading">
                            <h2 class="drop-title">
                                <span class="drop-title-inner"
                                    >Your title here<span class="drop-num"
                                        >#001</span
                                    ></span
                                >
                            </h2>
                            <span class="drop-arrow">→</span>
                        </div>
                    </a>
                </li>

                <li class="drop">
                    <a class="drop-link" href="#">
                        <div class="drop-heading">
                            <h2 class="drop-title">
                                <span class="drop-title-inner"
                                    >Untitled Draft<span class="drop-num"
                                        >#002</span
                                    ></span
                                >
                            </h2>
                            <span class="drop-arrow">→</span>
                        </div>
                    </a>
                </li>
            </ul>
        </main>

        <footer class="footer-strip">
            <span>© 2026 — DFXE</span>
            <a href="https://github.com/dfxe" target="_blank" rel="noopener"
                >GITHUB.COM/DFXE</a
            >
        </footer>

        <script>
            // Title ticker: enable when text overflows its container
            (function () {
                var titles = document.querySelectorAll(".drop-title");
                function check() {
                    titles.forEach(function (t) {
                        var inner = t.querySelector(".drop-title-inner");
                        if (!inner) return;
                        t.classList.remove("is-ticker");
                        if (inner.scrollWidth > t.clientWidth + 1) {
                            t.classList.add("is-ticker");
                        }
                    });
                }
                check();
                window.addEventListener("resize", check);
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(check);
                }
            })();
        </script>
    </body>
</html>
